<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1092 168" width="1092" height="168" role="img" aria-label="GitHub trophies">
<defs><style><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,sans-serif}
@keyframes popCell{0%{opacity:0;transform:translateY(16px) scale(.85)}70%{opacity:1;transform:translateY(-3px) scale(1.03)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes rankGlow{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes shineX2{0%{transform:translateX(-200px) skewX(-15deg)}60%,100%{transform:translateX(1172px) skewX(-15deg)}}
.cell{opacity:0;animation:popCell .55s cubic-bezier(.2,.8,.3,1.2) forwards;transform-box:fill-box;transform-origin:center}
.rk{animation:rankGlow 2.2s ease-in-out infinite}
.sh2{animation:shineX2 5s ease-in-out 2s infinite}
]]></style>
<linearGradient id="shg2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="tc"><rect x="0" y="0" width="1092" height="168" rx="14"/></clipPath>
</defs>

  <g class="cell" style="animation-delay:0.30s">
    <rect x="12" y="12" width="168" height="144" rx="14" fill="#170e28" stroke="#ff7eb6" stroke-opacity=".55" stroke-width="1.3"/>
    <text x="96" y="52" text-anchor="middle" font-size="30">🤖</text>
    <text class="rk" x="164" y="38" text-anchor="end" font-size="16" font-weight="bold" fill="#ff7eb6">SSS</text>
    <text x="96" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#e6edf3">AI Engineer</text>
    <text x="96" y="126" text-anchor="middle" font-size="10" fill="#9aa4b2">AI Projects x6</text>
    <line x1="28" y1="138" x2="164" y2="138" stroke="#ff7eb6" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g class="cell" style="animation-delay:0.45s">
    <rect x="192" y="12" width="168" height="144" rx="14" fill="#170e28" stroke="#fde047" stroke-opacity=".55" stroke-width="1.3"/>
    <text x="276" y="52" text-anchor="middle" font-size="30">🌟</text>
    <text class="rk" x="344" y="38" text-anchor="end" font-size="16" font-weight="bold" fill="#fde047">S</text>
    <text x="276" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#e6edf3">Starstruck</text>
    <text x="276" y="126" text-anchor="middle" font-size="10" fill="#9aa4b2">GitHub Badge</text>
    <line x1="208" y1="138" x2="344" y2="138" stroke="#fde047" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g class="cell" style="animation-delay:0.60s">
    <rect x="372" y="12" width="168" height="144" rx="14" fill="#170e28" stroke="#c084fc" stroke-opacity=".55" stroke-width="1.3"/>
    <text x="456" y="52" text-anchor="middle" font-size="30">⭐</text>
    <text class="rk" x="524" y="38" text-anchor="end" font-size="16" font-weight="bold" fill="#c084fc">A</text>
    <text x="456" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#e6edf3">Stargazer</text>
    <text x="456" y="126" text-anchor="middle" font-size="10" fill="#9aa4b2">Stars 30+</text>
    <line x1="388" y1="138" x2="524" y2="138" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g class="cell" style="animation-delay:0.75s">
    <rect x="552" y="12" width="168" height="144" rx="14" fill="#170e28" stroke="#38bdf8" stroke-opacity=".55" stroke-width="1.3"/>
    <text x="636" y="52" text-anchor="middle" font-size="30">💜</text>
    <text class="rk" x="704" y="38" text-anchor="end" font-size="16" font-weight="bold" fill="#38bdf8">A</text>
    <text x="636" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#e6edf3">Rising Star</text>
    <text x="636" y="126" text-anchor="middle" font-size="10" fill="#9aa4b2">Followers 20+</text>
    <line x1="568" y1="138" x2="704" y2="138" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g class="cell" style="animation-delay:0.90s">
    <rect x="732" y="12" width="168" height="144" rx="14" fill="#170e28" stroke="#60a5fa" stroke-opacity=".55" stroke-width="1.3"/>
    <text x="816" y="52" text-anchor="middle" font-size="30">💻</text>
    <text class="rk" x="884" y="38" text-anchor="end" font-size="16" font-weight="bold" fill="#60a5fa">A</text>
    <text x="816" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#e6edf3">Committer</text>
    <text x="816" y="126" text-anchor="middle" font-size="10" fill="#9aa4b2">Commits 450+</text>
    <line x1="748" y1="138" x2="884" y2="138" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g class="cell" style="animation-delay:1.05s">
    <rect x="912" y="12" width="168" height="144" rx="14" fill="#170e28" stroke="#4ade80" stroke-opacity=".55" stroke-width="1.3"/>
    <text x="996" y="52" text-anchor="middle" font-size="30">📦</text>
    <text class="rk" x="1064" y="38" text-anchor="end" font-size="16" font-weight="bold" fill="#4ade80">B</text>
    <text x="996" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#e6edf3">Creator</text>
    <text x="996" y="126" text-anchor="middle" font-size="10" fill="#9aa4b2">Repos 15+</text>
    <line x1="928" y1="138" x2="1064" y2="138" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g clip-path="url(#tc)" pointer-events="none">
    <rect x="0" y="0" width="160" height="168" fill="url(#shg2)" class="sh2"/>
  </g>
</svg>